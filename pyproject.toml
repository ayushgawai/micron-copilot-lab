[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micron-copilot-lab"
version = "0.1.0"
description = "Enterprise Copilot digital-assistant PoC with grounded RAG, business-case drafting, and anomaly digest over a synthetic operations corpus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
micron-copilot = "micron_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
